<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cricket Scorebook – Scorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6f1;--sf:#fff;--tx:#14231a;--mu:#5d6d62;--ac:#1f6b3a;--ac2:#c8372d;--ln:#d8e0d6;--ch:#e7efe5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--sf:#17261c;--tx:#e8f1ea;--mu:#9bb0a0;--ac:#58c27d;--ac2:#ff7a6e;--ln:#28402f;--ch:#1f3326;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a13;--sf:#17261c;--tx:#e8f1ea;--mu:#9bb0a0;--ac:#58c27d;--ac2:#ff7a6e;--ln:#28402f;--ch:#1f3326;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
h1,h2,h3,button,select,input,textarea,th,.num{font-family:"Trebuchet MS",Verdana,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
h1{font-size:21px;margin:0;color:var(--ac)}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.sb{border-left:6px solid var(--ac)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mu);text-align:right;font-weight:600;padding:4px}
td{padding:6px 4px;text-align:right;border-top:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
td small{display:block;color:var(--mu);font-size:12px}
.tbl{overflow-x:auto}
button{cursor:pointer}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.g button{padding:14px 0;font-size:18px;font-weight:700;border:1px solid var(--ln);background:var(--ch);color:var(--tx);border-radius:10px}
.g .w4{background:var(--ac);color:#fff}.g .wk{background:var(--ac2);color:#fff}
.b2{padding:10px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;font-size:14px;margin:2px}
.b2.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b2.d{color:var(--ac2)}
.ov{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ov span{min-width:30px;height:30px;border-radius:15px;background:var(--ch);display:inline-flex;align-items:center;justify-content:center;font:600 13px Verdana,sans-serif;padding:0 6px}
.ov .x{background:var(--ac2);color:#fff}.ov .f{background:var(--ac);color:#fff}
label{display:block;font:600 13px Verdana,sans-serif;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.best{background:var(--ac);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.best b{font-size:18px}
.res{font-weight:700;color:var(--ac2)}
.pick{border:2px dashed var(--ac);}
.pop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);overflow:hidden}
.pop .bx{background:var(--sf);color:var(--tx);border-radius:18px;padding:26px 34px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:pp .4s;max-width:90%}
.pop h2{font-size:46px;margin:0}.pop .p6{color:var(--ac)}.pop .pw{color:var(--ac2)}
.cf{position:absolute;top:-30px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes pp{from{transform:scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.cf{display:none}.pop .bx{animation:none}}
@media print{body{background:#fff;color:#000}.noprint,.pop{display:none!important}.c{border:1px solid #999;break-inside:avoid}}

</head><body><div class="w">
<header class="noprint"><h1>🏏 Cricket Scorebook</h1><div style="display:flex;align-items:center;gap:8px"><span id="st" class="mu"></span><button type="button" class="b2" id="tokenBtn">Update Token</button><button type="button" class="b2 d" id="resetBtn">Reset Tournament</button></div></header>
<nav class="noprint" id="nav"></nav>
<div id="app"></div></div>
<script id="state" type="application/json">{"T": [{"name": "Prahil Panthers", "g": "Male", "p": ["Jigar Shah", "Shrenil Shiroya", "Harsh Shah", "Nilay Bhandari", "Kunal Shah", "Raj Shah", "Amol Shah", "Rajesh Shah"]}, {"name": "Neevansh Warrios", "g": "Male", "p": ["Atul Shah", "Nitya Shah", "Jignesh Shah", "Akshay Shah", "Keyur Shah", "Kalpesh Shah", "Krunal Shah", "Maahir Shah"]}]}</script>
<script>
const VIEWER=false,BR='main',DATA_REPO='sagarshah318-byte/VSPL-5-Live-Data';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ov=b=>Math.floor(b/6)+'.'+b%6;
let H=[],M=null,T=[],U=[],tab='live',view=null,playerView=null,wk=null,CAN=!VIEWER,pt,popT,et=null,S={},pf=false;
try{S=JSON.parse(document.getElementById('state').textContent||'{}')}catch(e){}
T=S.T||[];S={};
if(!VIEWER)try{const L=JSON.parse(localStorage.getItem('sb_all')||'null');if(L){H=L.H||[];M=L.M||null;T=L.T||[]}}catch(e){}
try{tab=sessionStorage.getItem('sb_t')||'live'}catch(e){}
function save(){try{localStorage.setItem('sb_all',JSON.stringify({H,M,T,ts:Date.now()}))}catch(e){}if(CAN){clearTimeout(pt);pt=setTimeout(push,1500)}}
function repo(){
 let r='';const m=location.hostname.match(/^([^.]+)\.github\.io$/i),p=location.pathname.split('/').filter(Boolean);
 // GitHub Pages project sites use /REPO/; accept one path segment.
 if(m&&p.length>=1)r=m[1]+'/'+p[0];else try{r=localStorage.getItem('sb_repo')||''}catch(e){}
 if(!r){r=(prompt('GitHub repository, like username/repo:')||'').trim();try{localStorage.setItem('sb_repo',r)}catch(e){}}
 return r}
let SY='',TOK='',SHA=null,busy=false,dirty=false;
function tok(){try{TOK=TOK||localStorage.getItem('sb_tok')||''}catch(e){}
 if(!TOK){TOK=(prompt('Paste your GitHub token (kept only on this phone):')||'').trim();try{localStorage.setItem('sb_tok',TOK)}catch(e){}}return TOK}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function push(){
 if(VIEWER)return;if(busy){dirty=true;return}
 if(!tok()){SY='no token';st();return}
 busy=true;SY='sending…';st();
 const u='https://api.github.com/repos/'+DATA_REPO+'/contents/state.json',h={Authorization:'Bearer '+TOK,Accept:'application/vnd.github+json'};
 try{const body=JSON.stringify({H,M,T,ts:Date.now()});
  for(let k=0;k<3;k++){
   if(!SHA){const g=await fetch(u+'?ref='+BR+'&t='+Date.now(),{headers:h,cache:'no-store'});
    if(g.ok)SHA=(await g.json()).sha;else if(g.status!=404)throw new Error('GitHub '+g.status+(g.status==401?' (token wrong)':' (check repo and token)'))}
   const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(Object.assign({message:'score',content:b64(body),branch:BR},SHA?{sha:SHA}:{}))});
   if(p.ok){SHA=(await p.json()).content.sha;SY='live · sent '+new Date().toLocaleTimeString();break}
   if(p.status==409||p.status==422){SHA=null;continue}
   throw new Error('GitHub '+p.status+(p.status==401?' (token wrong)':p.status==404?' (repo or token access)':''))}
 }catch(e){SY='send failed: '+(e.message||e)}
 busy=false;st();if(dirty){dirty=false;push()}}
function st(){const e=document.getElementById('st');if(e&&!VIEWER)e.textContent='● scorer · '+(SY||'ready')}
function updateToken(){const t=prompt('Paste your new GitHub token. It will be saved only on this phone. Do not share it in chat.');if(t&&t.trim()){TOK=t.trim();try{localStorage.setItem('sb_tok',TOK)}catch(e){}SHA=null;SY='token updated · make a score update to test';st()}}
document.getElementById('tokenBtn').addEventListener('click',updateToken);
document.getElementById('resetBtn').addEventListener('click',resetTournament);
let resetBusy=false;
async function resetTournament(){
 if(resetBusy)return;
 if(!H.length&&!M){alert('There are no match records to reset.');return}
 if(!confirm('You are resetting the tournament. A PDF archive of all match scorecards and tournament leaders will be downloaded first. Your saved teams will be kept. Continue?'))return;
 if(typeof window.html2pdf!=='function'){alert('PDF tool did not load. Nothing has been reset. Please check your internet connection and try again.');return}
 resetBusy=true;
 const all=H.slice();if(M&&!M.done)all.unshift(M);
 const archive=document.createElement('div');
 archive.style.cssText='background:#fff;color:#111;padding:18px;font-family:Arial,sans-serif;width:780px';
 archive.innerHTML='<h1>VSPL Tournament Archive</h1><p>Archived on '+new Date().toLocaleString()+'</p><h2>Teams</h2>'+T.map(t=>'<p><b>'+esc(t.name)+'</b> ('+esc(t.g)+'): '+esc(t.p.join(', '))+'</p>').join('')+'<h2>Match scorecards ('+all.length+')</h2>'+all.map(m=>head(m)+card(m)).join('')+'<h2>Tournament leaders</h2>'+leaders();
 document.body.appendChild(archive);
 try{
  const filename='VSPL_Tournament_Archive_'+new Date().toISOString().slice(0,10)+'.pdf';
  await window.html2pdf().set({margin:8,filename,image:{type:'jpeg',quality:0.96},html2canvas:{scale:1.5,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(archive).save();
  archive.remove();
  if(!confirm('The PDF download has been started. Check your Downloads folder. Do you want to permanently clear all match records now? Saved teams will remain.')){resetBusy=false;return}
  const oldH=H,oldM=M,oldU=U;
  H=[];M=null;U=[];wk=null;view=null;tab='live';save();clearTimeout(pt);await push();
  if(!SY.startsWith('live · sent')){
   H=oldH;M=oldM;U=oldU;save();clearTimeout(pt);await push();r();
   alert('The reset could not be confirmed on the live server. Your match records have been restored on this device. Nothing has been intentionally cleared. Please check the scorer connection before trying again.');
   return;
  }
  r();alert('Tournament match records have been reset and synced. Your teams are still saved.');
 }catch(e){
  archive.remove();alert('PDF creation failed. No match data was reset. Error: '+(e.message||e));
 }finally{resetBusy=false}
}

function dg(t){const e=document.getElementById('st');if(e&&VIEWER)e.innerHTML='<small>'+esc(t)+'</small>'}
async function poll(){
 try{const g=await fetch('https://raw.githubusercontent.com/'+repo()+'/'+BR+'/state.json?t='+Date.now(),{cache:'no-store'});
  if(!g.ok)throw new Error(g.status==404?'no scores published yet':'GitHub '+g.status);
  const n=await g.json();dg('● live · updated '+new Date().toLocaleTimeString());
  if((n.ts||0)!=(S.ts||0)){const o=M&&M.last?M.last.n:null;S=n;H=n.H||[];M=n.M||null;T=n.T||[];r();const l=M&&M.last;if(pf&&l&&(o==null||l.n>o))pop(l,true)}
  pf=true
 }catch(e){dg('waiting… '+(e.message||e))}}
function shareTxt(m){
 const o=b=>Math.floor(b/6)+'.'+b%6;
 let t='🏏 '+m.teams[0].name+' vs '+m.teams[1].name+' ('+m.overs+' ov, '+m.date+')\n';
 m.innings.forEach((i,k)=>{const fin=m.done||k<m.cur;
  t+=m.teams[i.bat].name+' '+i.runs+'/'+i.wkts+' ('+o(i.balls)+' ov)\n';
  if(!fin){t+=[i.s,i.n].filter(n=>n&&i.B[n]).map(n=>n+(n==i.s?'*':'')+' '+i.B[n].r+' ('+i.B[n].b+')').join(', ')+'\n';if(i.b&&i.W[i.b])t+='Bowling: '+i.b+' '+o(i.W[i.b].b)+'-'+i.W[i.b].r+'-'+i.W[i.b].w+'\n'}
  else{const top=Object.entries(i.B).sort((a,b)=>b[1].r-a[1].r)[0],bw=Object.entries(i.W).sort((a,b)=>b[1].w-a[1].w||a[1].r-b[1].r)[0];
   if(top)t+='Top scorer: '+top[0]+' '+top[1].r+' ('+top[1].b+')\n';if(bw)t+='Best bowler: '+bw[0]+' '+bw[1].w+'/'+bw[1].r+'\n'}});
 if(m.done)t+='\n'+m.result;else if(m.cur){const i=m.innings[1],tg=m.innings[0].runs+1;t+='Target '+tg+', need '+Math.max(0,tg-i.runs)+' off '+Math.max(0,m.overs*6-i.balls)+' balls'}
 return t.trim()}
async function shareScore(id){
 const m=id?H.find(x=>x.id==id):M;if(!m)return;const t=shareTxt(m);
 try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name=='AbortError')return}
 try{navigator.clipboard.writeText(t)}catch(e){}
 const w=window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
 if(!w)prompt('Copy this and paste it in WhatsApp:',t)}
let _x=0;
function pop(l,f){
 if(!l||!/^(4|6|W)$/.test(l.l))return;const rem=f?4000:4000-(Date.now()-(l.ts||0));if(rem<700)return;clearTimeout(popT);
 let d=document.getElementById('pop');if(!d){d=document.createElement('div');d.id='pop';d.className='pop noprint';document.body.appendChild(d);d.onclick=()=>d.remove()}
 const E=['🎉','🎊','✨','🎈','🏏'],cf=Array.from({length:44},()=>`<span class="cf" style="left:${Math.random()*100}%;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.7}s">${E[Math.floor(Math.random()*5)]}</span>`).join('');
 d.innerHTML=cf+`<div class="bx"><h2 class="${l.l=='W'?'pw':'p6'}">${l.l=='4'?'FOUR! 🏏':l.l=='6'?'SIX! 🚀':'WICKET! ☝️'}</h2><p>${esc(l.t||'')}</p></div>`;
 popT=setTimeout(()=>d.remove(),rem)}
const mk=(bat,bowl)=>({bat,bowl,runs:0,wkts:0,balls:0,ex:0,B:{},W:{},over:[],lastB:null,s:null,n:null,b:null,fow:[]});
const bt=(i,k)=>i.B[k]||(i.B[k]={r:0,b:0,f:0,s:0,out:''});
const bw=(i,k)=>i.W[k]||(i.W[k]={b:0,r:0,w:0});
const lines=v=>v.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);

function teamOptions(){
 const a=T[+document.getElementById('tA').value],b=T[+document.getElementById('tB').value];
 const fill=(id,t)=>{const e=document.getElementById(id),old=e.value;e.innerHTML=opts(t.p,'Select captain');if(t.p.includes(old))e.value=old};
 fill('capA',a);fill('capB',b)}
function start(){
 const g=id=>document.getElementById(id).value,a=T[+g('tA')],b=T[+g('tB')];
 if(g('tA')==g('tB')){alert('Choose two different teams.');return}
 if(!g('capA')||!g('capB')){alert('Please select both team captains.');return}
 const toss=+g('toss'),first=g('decision')==='bat'?toss:1-toss;
 M={id:Date.now(),date:new Date().toISOString().slice(0,10),gender:a.g,overs:Math.max(1,+g('ov')||20),toss:{winner:toss,decision:g('decision')},teams:[{name:a.name,p:[...a.p],captain:g('capA')},{name:b.name,p:[...b.p],captain:g('capB')}],innings:[mk(first,1-first)],cur:0,done:false,result:''};
 U=[];save();r()}
function saveT(){const g=id=>document.getElementById(id).value,p=lines(g('tp'));
 if(!g('tn').trim()||p.length<2){alert('Enter a team name and at least 2 players.');return}
 const t={name:g('tn').trim(),g:g('tg'),p};if(et!=null)T[et]=t;else T.push(t);et=null;save();r()}
function delT(k){if(!confirm('Delete this team?'))return;T.splice(k,1);et=null;save();r()}
function clearT(){if(!confirm('Clear all saved teams? Do this only when the event is over.'))return;T=[];et=null;save();r()}
function teamsV(){const e=et!=null?T[et]:{name:'',g:'Male',p:[]};
 return `<div class="c"><h2 style="margin-top:0">${et!=null?'Edit team':'Add team'}</h2><label>Team name</label><input id="tn" value="${esc(e.name)}"><label>Category</label><select id="tg"><option${e.g=='Male'?' selected':''}>Male</option><option${e.g=='Female'?' selected':''}>Female</option></select><label>Players (one per line)</label><textarea id="tp" rows="8">${esc(e.p.join('\n'))}</textarea><p><button class="b2 p" onclick="saveT()">Save team</button>${et!=null?'<button class="b2" onclick="et=null;r()">Cancel</button>':''}</p></div>`+(T.length?`<div class="c"><b>Saved teams (${T.length})</b>`+T.map((t,k)=>`<p><b>${esc(t.name)}</b> <span class="mu">${t.g} · ${t.p.length} players</span><br><button class="b2" onclick="et=${k};r();scrollTo(0,0)">Edit</button><button class="b2 d" onclick="delT(${k})">Delete</button></p>`).join('')+`<button class="b2 d" onclick="clearT()">Event over: clear all teams</button></div>`:'<div class="c mu">No teams saved yet. Saved teams stay until you clear them.</div>')}

function swap(i){[i.s,i.n]=[i.n,i.s]}
function setR(k,v){const i=M.innings[M.cur];if(!v)return;i[k]=v;k=='b'?bw(i,v):bt(i,v);save();r()}

function ball(t,x){
 const i=M.innings[M.cur];if(M.done||!i.s||!i.n||!i.b)return;
 U.push(JSON.stringify(M));if(U.length>40)U.shift();
 const B=bt(i,i.s),W=bw(i,i.b);let lab,legal=true;
 if(t=='run'){B.r+=x;B.b++;x==4&&B.f++;x==6&&B.s++;W.r+=x;W.b++;i.runs+=x;i.balls++;lab=''+x;x%2&&swap(i)}
 else if(t=='wd'){W.r++;i.runs++;i.ex++;lab='Wd';legal=false}
 else if(t=='nb'){W.r++;i.runs++;i.ex++;lab='Nb';legal=false;i.freeHit=true}
 else if(t=='bye'){B.b++;W.b++;i.runs++;i.ex++;i.balls++;lab='B1';swap(i)}
 
 M.last={n:(M.last?M.last.n:0)+1,ts:Date.now(),l:lab,t:i.s+(lab=='4'?' hits a boundary':lab=='6'?' hits a huge six':'')};
 endBall(i,legal,lab)}
function endBall(i,legal,lab){
 i.over.push(lab);
 if(legal)i.freeHit=false;
 if(legal&&i.balls%6==0){ if(i.s===null){i.s=i.n;i.n=null}else if(i.n===null){i.n=i.s;i.s=null}else swap(i); i.lastB=i.b;i.b=null;i.over=[]}
 chk();save();r();pop(M.last)}
function openW(){const i=M.innings[M.cur];wk={t:'Bowled',f:'',who:i.s,r:0};r()}
function out(){
 const i=M.innings[M.cur];if(!wk||M.done||!i.s||!i.n||!i.b)return;
 if(['Caught','Stumped'].includes(wk.t)&&!wk.f){alert('Select the fielder.');return}
 if(i.freeHit&&wk.t!=='Run out'){alert('Free hit! Only a run out can dismiss the batter.');return}
 U.push(JSON.stringify(M));
 const ro=wk.t=='Run out',run=ro?wk.r:0,W=bw(i,i.b),b=i.b,f=wk.f;
 if(run){bt(i,i.s).r+=run;W.r+=run;i.runs+=run}
 bt(i,i.s).b++;W.b++;i.balls++;if(run%2)swap(i);
 const who=ro?wk.who:i.s,X=bt(i,who);
 X.out={Bowled:'b '+b,Caught:f==b?'c & b '+b:'c '+f+' b '+b,LBW:'lbw b '+b,Stumped:'st '+f+' b '+b,'Hit wicket':'hit wicket b '+b,'Run out':'run out'+(f?' ('+f+')':'')}[wk.t];
 if(!ro)W.w++;i.wkts++;i.fow.push(i.runs+'/'+i.wkts+' ('+who+')');
 if(i.s==who)i.s=null;else i.n=null;
 M.last={n:(M.last?M.last.n:0)+1,ts:Date.now(),l:'W',t:who+' '+X.out};
 wk=null;endBall(i,true,run?'W'+run:'W')}
function wkP(i,O){
 const sel=(k,l,v)=>`<label>${l}</label><select onchange="wk.${k}=${k=='r'?'+':''}this.value;r()">${v.map(x=>`<option value="${esc(x)}"${String(x)==String(wk[k])?' selected':''}>${x===''?'Select player':esc(x)}</option>`).join('')}</select>`;
 return `<div class="c pick"><b>How was the batter out?</b>${sel('t','Dismissal',['Bowled','Caught','LBW','Run out','Stumped','Hit wicket'])}${['Caught','Stumped','Run out'].includes(wk.t)?sel('f',wk.t=='Caught'?'Caught by':wk.t=='Stumped'?'Wicketkeeper':'Fielder (optional)',['',...O.p]):''}${wk.t=='Run out'?sel('who','Batter run out',[i.s,i.n])+sel('r','Runs completed before run out',[0,1,2,3]):''}<p><button class="b2 d" onclick="out()">Confirm out</button><button class="b2" onclick="wk=null;r()">Cancel</button></p></div>`}

function undo(){if(!U.length)return;M=JSON.parse(U.pop());wk=null;H=H.filter(h=>h.id!=M.id);save();r()}

function chk(){
 const i=M.innings[M.cur],n=M.teams[i.bat].p.length-1,tg=M.cur?M.innings[0].runs:null;
 if(i.wkts>=n||i.balls>=M.overs*6||(tg!==null&&i.runs>tg)){
  if(M.cur==0){M.cur=1;M.innings.push(mk(i.bowl,i.bat))}else finish()}}
function finish(){
 const a=M.innings[0],b=M.innings[1],A=M.teams[a.bat].name,Bn=M.teams[b.bat].name;
 M.result=b.runs>a.runs?Bn+' won by '+(M.teams[b.bat].p.length-1-b.wkts)+' wickets':b.runs<a.runs?A+' won by '+(a.runs-b.runs)+' runs':'Match tied';
 M.done=true;H=H.filter(h=>h.id!=M.id);H.unshift(M)}
function endNow(){if(!confirm('End match now and save it?'))return;
 if(M.cur==0){M.cur=1;M.innings.push(mk(M.innings[0].bowl,M.innings[0].bat))}
 finish();save();r()}
function newM(){if(M&&!M.done){alert('Finish or save the current match before starting another.');return}M=null;U=[];wk=null;view=null;tab='live';save();r();scrollTo(0,0)}
function del(id){if(!confirm('Delete this match record?'))return;H=H.filter(h=>h.id!=id);view=null;save();r()}

function matchAwards(m){
 const bat=[],bowl=[];
 m.innings.forEach(i=>{
  for(const n in i.B){const x=i.B[n];if(x.b)bat.push({n,t:m.teams[i.bat].name,r:x.r,b:x.b,f:x.f,s:x.s})}
  for(const n in i.W){const x=i.W[n];if(x.b)bowl.push({n,t:m.teams[i.bowl].name,w:x.w,r:x.r,b:x.b,e:x.r*6/x.b})}
 });
 const maxRuns=bat.length?Math.max(...bat.map(x=>x.r)):-1;
 const topBat=bat.filter(x=>x.r===maxRuns);
 const maxW=bowl.length?Math.max(...bowl.map(x=>x.w)):-1;
 const topW=maxW<0?[]:bowl.filter(x=>x.w===maxW);
 const bestE=topW.length?Math.min(...topW.map(x=>x.e)):Infinity;
 const topBowl=topW.filter(x=>Math.abs(x.e-bestE)<0.000001);
 const names=a=>a.map(x=>esc(x.n)+' <small>'+esc(x.t)+'</small>').join(', ');
 return '<div class="c"><h2 style="margin:0 0 8px">🏆 Individual Match Awards</h2>'+
  (topBat.length?'<div class="best">Best Batter'+(topBat.length>1?'s':'')+'<br><b>'+names(topBat)+'</b><br>'+maxRuns+' runs'+(topBat.length===1?' · '+topBat[0].b+' balls · SR '+(topBat[0].r*100/topBat[0].b).toFixed(0):' · tied')+'</div>':'<div class="mu">Best Batter: No batting data available.</div>')+
  (topBowl.length?'<div class="best">Best Bowler'+(topBowl.length>1?'s':'')+'<br><b>'+names(topBowl)+'</b><br>'+maxW+' wickets · '+bestE.toFixed(1)+' economy'+(topBowl.length>1?' · tied':'')+'</div>':'<div class="mu">Best Bowler: No bowling data available.</div>')+
  '<p class="mu">Best batter is decided by highest runs. Best bowler is decided by most wickets, with lower economy as the tie-breaker.</p></div>';
}
function card(m){return (m.done?matchAwards(m):'')+m.innings.map((i,k)=>{
 const T=m.teams[i.bat],O=m.teams[i.bowl],fin=m.done||k<m.cur;
 const rows=Object.keys(i.B).map(n=>{const x=i.B[n];return `<tr><td>${esc(n)}<small>${x.out?esc(x.out):fin?'not out':(n==i.s||n==i.n)?'batting':'not out'}</small></td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td><td>${x.b?(x.r*100/x.b).toFixed(0):'-'}</td></tr>`}).join('');
 const dnb=T.p.filter(p=>!i.B[p]);
 const bro=Object.keys(i.W).map(n=>{const x=i.W[n];return `<tr><td>${esc(n)}</td><td>${ov(x.b)}</td><td>${x.r}</td><td><b>${x.w}</b></td><td>${x.b?(x.r*6/x.b).toFixed(1):'-'}</td></tr>`}).join('');
 return `<div class="c"><h3 style="margin:0 0 6px">${esc(T.name)} <span class="num">${i.runs}/${i.wkts}</span> <span class="mu">(${ov(i.balls)} ov)</span></h3>
 <div class="tbl"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${rows}</table></div>
 <p class="mu">Extras ${i.ex}${dnb.length?' · Did not bat: '+esc(dnb.join(', ')):''}${i.fow.length?'<br>Fall of wickets: '+esc(i.fow.join(', ')):''}</p>
 <div class="tbl"><table><tr><th>Bowler (${esc(O.name)})</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>${bro||'<tr><td colspan=5>–</td></tr>'}</table></div></div>`}).join('')}

function head(m){return `<div class="c sb"><div class="mu">${esc(m.date)} · ${m.gender} · ${m.overs} overs</div>
 <h2 style="margin:2px 0">${esc(m.teams[0].name)} vs ${esc(m.teams[1].name)}</h2>${m.teams[0].captain||m.teams[1].captain?'<div class="mu">Captains: '+esc(m.teams[0].captain||'Not set')+' · '+esc(m.teams[1].captain||'Not set')+'</div>':''}${m.toss?'<div class="mu">Toss: '+esc(m.teams[m.toss.winner].name)+' won and chose to '+(m.toss.decision==='bat'?'bat':'bowl')+'</div>':''}${m.done?`<div class="res">${esc(m.result)}</div>`:''}</div>`}

function opts(list,ph){return `<option value="">${ph}</option>`+list.map(p=>`<option>${esc(p)}</option>`).join('')}

function live(){
 if(!M&&!CAN)return '<div class="c">No match is live right now. This page updates by itself when scoring starts.</div>';
 if(!M)return T.length<2?`<div class="c"><h2 style="margin-top:0">New match</h2><p>Save at least two teams with their players first. They stay saved until you clear them.</p><button class="b2 p" onclick="tab='teams';r()">Go to Teams</button></div>`:`<div class="c"><h2 style="margin-top:0">New match</h2><div class="r2"><div><label>Team A</label><select id="tA" onchange="teamOptions()">${T.map((t,k)=>`<option value="${k}">${esc(t.name)} (${t.g})</option>`).join('')}</select></div><div><label>Team B</label><select id="tB" onchange="teamOptions()">${T.map((t,k)=>`<option value="${k}"${k==1?' selected':''}>${esc(t.name)} (${t.g})</option>`).join('')}</select></div></div><div class="r2"><div><label>Overs</label><input id="ov" type="number" value="20" min="1"></div><div><label>Toss won by</label><select id="toss"><option value="0">Team A</option><option value="1">Team B</option></select></div></div><div class="r2"><div><label>Team A Captain</label><select id="capA"></select></div><div><label>Team B Captain</label><select id="capB"></select></div></div><label>Toss decision</label><select id="decision"><option value="bat">Winner chose to bat</option><option value="bowl">Winner chose to bowl</option></select><p class="mu">Category follows Team A. Select both captains and record the toss before starting.</p><p><button class="b2 p" onclick="start()">Start match</button></p></div>`;
 const i=M.innings[M.cur],BT=M.teams[i.bat],O=M.teams[i.bowl],tg=M.cur?M.innings[0].runs+1:null;
 if(M.done)return `<div class="c"><h3 style="margin:0 0 4px">🏏 Match completed!</h3><p style="margin:0">Thank you for following the match. The next match will begin soon. Stay tuned for live updates.</p></div><div class="noprint">${VIEWER?'<button class="b2 p" onclick="refreshViewer()">↻ Refresh</button>':''}${CAN?'<button class="b2 p" onclick="newM()">＋ Start New Match</button>':''}</div>`;
 let h=head(M);
 const left=M.overs*6-i.balls;
 h+=`<div class="c sb"><div class="mu">${esc(BT.name)} batting · Innings ${M.cur+1}</div><div class="big num">${i.runs}/${i.wkts} <span class="mu" style="font-size:16px">(${ov(i.balls)}/${M.overs})</span></div>
 <div class="mu">${i.freeHit?'<b style="color:var(--ac2)">FREE HIT</b> · ':''}Run rate ${i.balls?(i.runs*6/i.balls).toFixed(2):'0.00'}${tg?` · Target ${tg} · Need ${Math.max(0,tg-i.runs)} off ${left} balls`:''}</div></div>`;
 const bats=BT.p.filter(p=>!(i.B[p]&&i.B[p].out)&&p!=i.s&&p!=i.n);
 const need=[];
 const nb=Object.keys(i.B).length>=2;
 if(!i.s)need.push(['s',nb?'Next batter':'Striker',bats.filter(p=>p!=i.n)]);
 if(!i.n)need.push(['n',nb?'Next batter':'Non-striker',bats.filter(p=>p!=i.s)]);
 if(!i.b)need.push(['b','Bowler for this over',O.p.filter(p=>p!=i.lastB)]);
 if(need.length&&!CAN)return h+'<div class="c mu">Waiting for the scorer…</div>'+card(M);
 if(need.length)return h+`<div class="c pick"><b>Choose to continue</b>${i.balls&&i.balls%6==0&&!M.done?'<p><button class="b2 p" onclick="shareScore()">Share over summary</button></p>':''}${need.map(n=>`<label>${n[1]}</label><select onchange="setR('${n[0]}',this.value)">${opts(n[2],'Select player')}</select>`).join('')}
 <p><button class="b2 d" onclick="undo()">Undo last ball</button></p></div>`+card(M);
 const bs=n=>{const x=i.B[n];return `<tr><td>${esc(n)}${n==i.s?' *':''}</td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td><td>${x.b?(x.r*100/x.b).toFixed(0):'-'}</td></tr>`},w=i.W[i.b];
 h+=`<div class="c noprint"><div class="tbl"><table><tr><th>Batting</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${bs(i.s)}${bs(i.n)}</table>
 <table><tr><th>Bowling</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr><tr><td>${esc(i.b)}</td><td>${ov(w.b)}</td><td>${w.r}</td><td><b>${w.w}</b></td><td>${w.b?(w.r*6/w.b).toFixed(1):'-'}</td></tr></table></div>
 <div class="ov">${i.over.map(x=>`<span class="${/^W\d?$/.test(x)?'x':/^(4|6)$/.test(x)?'f':''}">${x}</span>`).join('')||'<span>–</span>'}</div>
 ${CAN?`${wk?wkP(i,O):''}<div class="g"${wk?' style="display:none"':''}>${[0,1,2,3].map(n=>`<button onclick="ball('run',${n})">${n}</button>`).join('')}
 <button class="w4" onclick="ball('run',4)">4</button><button class="w4" onclick="ball('run',6)">6</button><button class="wk" onclick="openW()">OUT</button><button onclick="ball('bye')">Bye</button>
 <button onclick="ball('wd')">Wide</button><button onclick="ball('nb')">No ball</button><button onclick="swap(M.innings[M.cur]);save();r()">Swap</button><button onclick="undo()">Undo</button></div>
 <button class="b2 p" onclick="shareScore()">Share score</button><button class="b2 d" onclick="endNow()">End match &amp; save</button>`:''}</div>`;
 return h+card(M)}

function matches(){
 const canNew=CAN&&(!M||M.done);
 const action=canNew?'<div class="c noprint"><button class="b2 p" onclick="newM()">＋ New match</button></div>':'';
 if(view){const m=H.find(x=>x.id==view);if(m)return action+`<div class="noprint"><button class="b2" onclick="view=null;r()">Back</button><button class="b2 p" onclick="window.print()">Save as PDF</button>${CAN?'<button class="b2 d" onclick="del('+m.id+')">Delete</button>':''}</div>`+head(m)+card(m)}
 if(!H.length)return action+'<div class="c">No finished matches yet. Completed matches will be saved here automatically.</div>';
 return action+H.map(m=>{const a=m.innings[0],b=m.innings[1]||{runs:0,wkts:0};return `<div class="c" onclick="view=${m.id};r()" style="cursor:pointer"><div class="mu">${esc(m.date)} · ${m.gender} · ${m.overs} ov</div>
 <b>${esc(m.teams[a.bat].name)} ${a.runs}/${a.wkts}</b> vs <b>${esc(m.teams[a.bowl].name)} ${b.runs}/${b.wkts}</b><div class="res">${esc(m.result)}</div></div>`}).join('')}

function playerMatches(name,gender){
 const rows=[];
 H.forEach(m=>{if(m.gender!==gender)return;m.innings.forEach((i,k)=>{
  const team=m.teams[i.bat].p.includes(name)?m.teams[i.bat]:m.teams[i.bowl].p.includes(name)?m.teams[i.bowl]:null;
  if(!team)return;const bat=i.B[name]||null,bowl=i.W[name]||null;
  if(bat||bowl)rows.push({date:m.date,match:m.teams[0].name+' vs '+m.teams[1].name,team:team.name,innings:k+1,bat,bowl,result:m.result});
 })});return rows;
}
function players(){
 if(playerView){
  const a=playerView.split('|'),gender=a[0],name=a.slice(1).join('|'),rows=playerMatches(name,gender);
  let runs=0,balls=0,fours=0,sixes=0,outs=0,bb=0,conceded=0,wickets=0;
  rows.forEach(x=>{if(x.bat){runs+=x.bat.r;balls+=x.bat.b;fours+=x.bat.f;sixes+=x.bat.s;if(x.bat.out)outs++}if(x.bowl){bb+=x.bowl.b;conceded+=x.bowl.r;wickets+=x.bowl.w}});
  const matchRows=rows.map(x=>'<div class="c"><b>'+esc(x.match)+'</b><div class="mu">'+esc(x.date)+' · '+esc(x.team)+' · Innings '+x.innings+'</div>'+(x.bat?'<p><b>Batting:</b> '+x.bat.r+' runs off '+x.bat.b+' balls · 4s '+x.bat.f+' · 6s '+x.bat.s+' · '+(x.bat.out?esc(x.bat.out):'not out')+'</p>':'')+(x.bowl?'<p><b>Bowling:</b> '+ov(x.bowl.b)+' overs · '+x.bowl.r+' runs · '+x.bowl.w+' wickets · Econ '+(x.bowl.b?(x.bowl.r*6/x.bowl.b).toFixed(2):'—')+'</p>':'')+'<div class="mu">'+esc(x.result)+'</div></div>').join('');
  return '<div class="noprint"><button class="b2" onclick="playerView=null;r()">← All players</button></div><div class="c sb"><h2>'+esc(name)+'</h2><div class="mu">'+gender+' · '+rows.length+' match innings</div></div><div class="c"><h3>Batting · Tournament total</h3><div class="r2"><div><b>'+runs+'</b><div class="mu">Runs</div></div><div><b>'+balls+'</b><div class="mu">Balls</div></div><div><b>'+(outs?(runs/outs).toFixed(2):'—')+'</b><div class="mu">Average</div></div><div><b>'+(balls?(runs*100/balls).toFixed(1):'—')+'</b><div class="mu">Strike rate</div></div><div><b>'+fours+'</b><div class="mu">4s</div></div><div><b>'+sixes+'</b><div class="mu">6s</div></div></div><h3>Bowling · Tournament total</h3><div class="r2"><div><b>'+ov(bb)+'</b><div class="mu">Overs</div></div><div><b>'+conceded+'</b><div class="mu">Runs conceded</div></div><div><b>'+wickets+'</b><div class="mu">Wickets</div></div><div><b>'+(bb?(conceded*6/bb).toFixed(2):'—')+'</b><div class="mu">Economy</div></div></div></div><h3>Match-wise performance</h3>'+(matchRows||'<div class="c">No individual scorecard entries found yet.</div>');
 }
 const seen={};H.forEach(m=>m.teams.forEach(t=>t.p.forEach(n=>{seen[m.gender+'|'+n]={n:n,g:m.gender}})));
 const list=Object.values(seen).sort((a,b)=>a.g.localeCompare(b.g)||a.n.localeCompare(b.n));
 return '<h2>Individual Player Profiles</h2><p class="mu">Select a player to view tournament totals and match-by-match batting and bowling figures.</p>'+(list.length?list.map(p=>'<div class="c" style="cursor:pointer" onclick="playerView=\''+esc(p.g+'|'+p.n).replace(/'/g,'&#39;')+'\';r()"><b>'+esc(p.n)+'</b><div class="mu">'+p.g+'</div></div>').join(''):'<div class="c">Player profiles will appear here after the first match is completed.</div>');
}
function agg(){const a={};
 H.forEach(m=>m.innings.forEach(i=>{
  for(const n in i.B){const k=m.gender+'|'+n,x=a[k]||(a[k]={n,g:m.gender,t:m.teams[i.bat].name,r:0,b:0,f:0,s:0,wb:0,wr:0,w:0});const y=i.B[n];x.r+=y.r;x.b+=y.b;x.f+=y.f;x.s+=y.s}
  for(const n in i.W){const k=m.gender+'|'+n,x=a[k]||(a[k]={n,g:m.gender,t:m.teams[i.bowl].name,r:0,b:0,f:0,s:0,wb:0,wr:0,w:0});const y=i.W[n];x.wb+=y.b;x.wr+=y.r;x.w+=y.w}}));
 return Object.values(a)}
function leaders(){
 const A=agg();
 return ['Male','Female'].map(g=>{
  const P=A.filter(x=>x.g==g),B=P.filter(x=>x.b).sort((a,b)=>b.r-a.r).slice(0,5),W=P.filter(x=>x.wb).sort((a,b)=>b.w-a.w||a.wr/a.wb-b.wr/b.wb).slice(0,5);
  const bb=B[0],bw_=W[0];
  return `<h2>${g}</h2>`+(!bb?'<div class="c">No data yet.</div>':`
  <div class="best">Best batter<br><b>${esc(bb.n)}</b> · ${bb.r} runs (${bb.b} balls, SR ${(bb.r*100/bb.b).toFixed(0)}) · ${esc(bb.t)}</div>
  <div class="c tbl"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${B.map(x=>`<tr><td>${esc(x.n)}<small>${esc(x.t)}</small></td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td><td>${(x.r*100/x.b).toFixed(0)}</td></tr>`).join('')}</table></div>
  ${bw_?`<div class="best">Best bowler<br><b>${esc(bw_.n)}</b> · ${bw_.w} wickets, economy ${(bw_.wr*6/bw_.wb).toFixed(1)} · ${esc(bw_.t)}</div>
  <div class="c tbl"><table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>${W.map(x=>`<tr><td>${esc(x.n)}<small>${esc(x.t)}</small></td><td>${ov(x.wb)}</td><td>${x.wr}</td><td><b>${x.w}</b></td><td>${(x.wr*6/x.wb).toFixed(1)}</td></tr>`).join('')}</table></div>`:''}`)}).join('')}

function r(){
 st();
 $n=document.getElementById('nav');
 $n.innerHTML=[['live','Live'],['matches','Matches'],['top','Best players'],['players','Players']].concat(CAN?[['teams','Teams']]:[]).map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';view=null;if(tab!=='players')playerView=null;try{sessionStorage.sb_t=tab}catch(e){}r();scrollTo(0,0)">${t[1]}</button>`).join('');
 document.getElementById('app').innerHTML=tab=='live'?live():tab=='matches'?matches():tab=='players'?players():tab=='teams'&&CAN?teamsV():leaders();if(tab=='live'&&!M&&CAN&&document.getElementById('capA'))teamOptions();
}
(()=>{
 if(!CAN&&tab=='teams')tab='live';
 r();try{setTimeout(()=>scrollTo(0,+(sessionStorage.sb_y||0)),0);addEventListener('scroll',()=>{sessionStorage.sb_y=scrollY})}catch(e){}
 if(VIEWER){poll();setInterval(poll,5000)}else st()})();
</script></body></html>
