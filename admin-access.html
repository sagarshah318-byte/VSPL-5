<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSPL-5 Access Approval</title><style>body{font:16px Arial,sans-serif;background:#f3f6f1;color:#14231a;max-width:760px;margin:24px auto;padding:12px}.card{background:white;border:1px solid #d8e0d6;border-radius:12px;padding:16px;margin:12px 0}button{padding:9px 13px;border:0;border-radius:7px;margin:5px;cursor:pointer;background:#1f6b3a;color:white}.danger{background:#a22}small{color:#657}</style></head><body><h1>VSPL-5 · Access approvals</h1><p>Only the verified administrator can approve or revoke scoring access.</p><div id="status" class="card">Checking sign-in…</div><div id="list"></div><script>
async function load(){const s=await fetch('/api/session',{cache:'no-store'}).then(r=>r.json());if(!s.authenticated){document.getElementById('status').innerHTML='<a href="/api/auth/github">Sign in with GitHub</a>';return}if(!s.admin){document.getElementById('status').textContent='Administrator access only.';return}document.getElementById('status').textContent='Signed in as '+s.email;const d=await fetch('/api/admin/requests',{cache:'no-store'}).then(r=>r.json());document.getElementById('list').innerHTML=(d.requests||[]).map(x=>'<div class="card"><b>'+esc(x.github_login)+'</b> · '+esc(x.email)+'<br><small>'+esc(x.status)+' · requested '+new Date(x.requested_at*1000).toLocaleString()+(x.expires_at?' · expires '+new Date(x.expires_at*1000).toLocaleString():'')+'</small><br>'+(x.status==='pending'?'<button onclick="act(\''+x.id+'\',\'approve\')">Approve 7 days</button><button class="danger" onclick="act(\''+x.id+'\',\'reject\')">Reject</button>':'')+(x.status==='approved'?'<button class="danger" onclick="act(\''+x.id+'\',\'revoke\')">Revoke access</button>':'')+'</div>').join('')||'<div class="card">No requests yet.</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function act(id,action){const r=await fetch('/api/admin/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});if(!r.ok){alert('Action failed. Please refresh and try again.');return}load()}
load();
</script></body></html>
